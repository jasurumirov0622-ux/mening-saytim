<meta name="theme-color" content="#0b1220">
<title>ONSPORTS.UZ — futbol natijalari va yangiliklar</title>
<meta name="description" content="ONSPORTS.UZ: jonli futbol natijalari, o'yinlar jadvali, liga turnir jadvallari va yangiliklar o'zbek tilida.">
<script>try{if(localStorage.getItem("theme")==="light")document.documentElement.dataset.theme="light"}catch(e){}</script>
<style>
:root{--bg:#0b1220;--card:#131c30;--line:#22304d;--tx:#eef2fa;--mu:#8a98b5;--ac:#2fd08a;--live:#ff5a5f}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
img{width:22px;height:22px;object-fit:contain;flex:none}
header{position:sticky;top:0;z-index:5;background:rgba(11,18,32,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1080px;margin:0 auto;padding:0 16px;height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-size:22px;font-weight:800;text-decoration:none}
.logo span{color:var(--ac)}
.bar nav{display:flex;gap:6px;align-items:center}
.bar nav a{padding:7px 14px;border-radius:99px;text-decoration:none;color:var(--mu);font-weight:600;font-size:14px}
.bar nav a:hover{color:var(--tx);background:var(--card)}
.bar nav a.tgb{border:1px solid var(--ac);color:var(--ac)}
.bar nav a.tgb:hover{background:var(--ac);color:#052015}
.pt{margin:18px 16px 4px;font-size:24px}
.pt small{display:block;color:var(--mu);font:600 12px system-ui;letter-spacing:1px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:8px 16px}
.chip{border:1px solid var(--line);background:none;color:var(--mu);padding:7px 14px;border-radius:99px;white-space:nowrap}
.chip.on{background:var(--ac);border-color:var(--ac);color:#052015;font-weight:700}
.chip i{font-style:normal;opacity:.7;margin-left:4px;font-size:12px}
.lg,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:10px 16px;overflow:hidden}
.card{padding:4px 0}
.lgh{display:flex;align-items:center;gap:10px;padding:12px 14px;font-size:15px;background:linear-gradient(90deg,rgba(47,120,214,.22),transparent 70%)}
.lgh em{font-style:normal;color:var(--live);font-size:13px;font-weight:700}
.m{position:relative;display:grid;grid-template-columns:1fr 72px 1fr;align-items:center;gap:8px;padding:12px;border-top:1px solid var(--line)}
.m.lv::before{content:"";position:absolute;left:0;top:12%;bottom:12%;width:4px;border-radius:0 4px 4px 0;background:var(--live)}
.t{display:flex;align-items:center;gap:8px;min-width:0}
.t.r{justify-content:flex-end;text-align:right}
.t b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.c{text-align:center;font-size:20px;font-weight:800;line-height:1.15;padding:9px 6px;border-radius:16px;background:#1a2338;border:1px solid var(--line);font-variant-numeric:tabular-nums}
.c small{display:block;margin-top:3px;font-size:12px;font-weight:600;color:var(--mu)}
.c.live{background:#2b1a27;border-color:#3d2234}
.c.live small{color:var(--live)}
.empty{text-align:center;color:var(--mu);padding:40px 16px}
h3.sec{margin:16px 16px 6px;font-size:14px;color:var(--mu);font-weight:600}
.row{display:grid;grid-template-columns:24px 1fr 28px 34px 34px;align-items:center;gap:8px;margin:0 16px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row.h{color:var(--mu);font-size:12px}
.row .n{display:flex;align-items:center;gap:8px;min-width:0}
.row .n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row>*:nth-child(n+3){text-align:right}
.hero{display:block;position:relative;margin:10px 16px;border-radius:20px;overflow:hidden;height:230px;color:#fff;text-decoration:none;background:#000}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .ov{position:absolute;inset:0;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(transparent 30%,rgba(0,0,0,.88))}
.hero h2{margin:4px 0 0;font-size:20px;line-height:1.25}
.nr{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);text-decoration:none}
.nr:last-child{border:0}
.nr div{flex:1}
.nr h4{margin:4px 0 0;font-size:15px;line-height:1.3}
.nr img.th{width:64px;height:64px;border-radius:10px;object-fit:cover}
.nr small,.hero small{font-size:12px;color:var(--mu)}
.nr small b,.hero small b{color:var(--ac)}
.hero small{color:#ffffffb0}
.tgcta{display:block;margin:10px 16px;padding:18px;border-radius:22px;background:linear-gradient(135deg,#0f5a44,#12233a 75%);border:1px solid var(--line);text-decoration:none}
.tgcta b{display:block;font-size:18px}
.tgcta span{color:#b7c6d6;font-size:14px}
footer{border-top:1px solid var(--line);color:var(--mu);text-align:center;padding:22px 16px;font-size:13px}
.page{max-width:760px;margin:0 auto;padding:8px 0 60px}
.tab[hidden]{display:none}
.bar nav a.on{background:var(--card);color:var(--tx)}
.err{color:var(--mu);font-size:12px;margin-top:8px}
@media(max-width:640px){.bar nav a{padding:7px 10px;font-size:13px}.logo{font-size:19px}.bar{gap:6px}}

/* news portal layout */
header{background:none;backdrop-filter:none;border:0;padding:0}
.bar{width:calc(100% - 32px);max-width:1068px;margin:10px auto;padding:0 12px;height:56px;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.page{max-width:1100px}
.narrow{max-width:760px;margin:0 auto}
.nwrap{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;padding:8px 16px 0}
.nhero{position:relative;display:block;border-radius:20px;overflow:hidden;min-height:380px;background:linear-gradient(135deg,#17335a,#0f1729);color:#fff;text-decoration:none}
.nhero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.nhero .ov{position:absolute;inset:0;padding:22px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(transparent 25%,rgba(0,0,0,.88))}
.nhero h2{margin:0 0 8px;font-size:clamp(20px,3vw,30px);line-height:1.2}
.nhero p{margin:0 0 10px;color:#d5dcea;font-size:15px}
.nhero small{color:#ffffffb8;font-size:12px}
.nside{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ncard{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-decoration:none}
.ncard:hover{border-color:var(--ac)}
.nimg{aspect-ratio:16/10;background:linear-gradient(135deg,#17335a,#0f1729);display:grid;place-items:center;color:var(--ac);font-weight:800;font-size:13px;overflow:hidden}
.nimg img{width:100%;height:100%;object-fit:cover}
.nbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.nbody h3{margin:0;font-size:15px;line-height:1.3;font-weight:700}
.nbody small{color:var(--mu);font-size:12px}
.more{display:flex;align-items:center;gap:14px;margin:30px 16px 16px;color:var(--mu);font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
.more::before,.more::after{content:"";flex:1;height:1px;background:var(--line)}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;padding:0 16px}
@media(max-width:820px){.nwrap{grid-template-columns:1fr}.nhero{min-height:300px}}
@media(max-width:480px){.nside{grid-template-columns:1fr}}
.crumb{max-width:1068px;margin:0 auto;padding:6px 16px 2px;color:var(--mu);font-size:13px}.crumb b{color:var(--tx);font-size:16px;margin:0 6px}.crumb i{font-style:normal;color:var(--ac)}

:root[data-theme="light"]{--bg:#f3f6fb;--card:#ffffff;--line:#dde4ee;--tx:#101828;--mu:#667085;--ac:#0fa968;--live:#e5383b}
[data-theme="light"] .c{background:#eef2f8}
[data-theme="light"] .c.live{background:#fdecee;border-color:#f5c6cb}
[data-theme="light"] .nimg{background:linear-gradient(135deg,#dbe7f7,#eef2f8)}
[data-theme="light"] .tgcta{background:linear-gradient(135deg,#d9f5e8,#e6edf8)}
[data-theme="light"] .tgcta span{color:#475467}
[data-theme="light"] .nbody small,[data-theme="light"] .nhero small{}
.tools{display:flex;align-items:center;gap:2px;margin-left:8px;padding:3px;border:1px solid var(--line);border-radius:99px}
.ib{width:36px;height:36px;border:0;background:none;border-radius:50%;color:var(--tx);display:grid;place-items:center}
.ib:hover{background:var(--bg)}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#sq{background:none;border:0;color:var(--tx);font:inherit;width:170px;padding:0 8px;outline:none}
#sq[hidden]{display:none}
@media(max-width:640px){.bar nav a.tgb{display:none}#sq{width:110px}.tools{margin-left:4px}}

.lb{width:auto;padding:0 10px;gap:6px;display:flex;align-items:center;border-left:1px solid var(--line);border-radius:0 99px 99px 0;font-weight:700;font-size:13px;margin-left:2px}
.lb svg{width:18px;height:18px}
@media(max-width:640px){.bar{height:auto;flex-wrap:wrap;padding:8px 12px;row-gap:6px}.bar nav{order:3;width:100%;justify-content:space-around}}

/* match details */
.m{grid-template-columns:1fr 84px 1fr}
.m.k{cursor:pointer;transition:background .15s}
.m.k:hover,.m.k:focus-visible{background:rgba(47,208,138,.07)}
.c small.pn{margin-top:1px;color:var(--ac);font-weight:700}
.pw{font-style:normal;flex:none;width:18px;height:18px;border-radius:50%;background:var(--ac);color:#052015;font-size:12px;font-weight:800;display:grid;place-items:center}
.mo{position:fixed;inset:0;z-index:50;background:rgba(3,8,18,.72);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:16px}
.mo[hidden]{display:none}
.mb{position:relative;width:100%;max-width:640px;margin:auto 0;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 16px 20px}
.mx{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:20px;line-height:1}

  else if(c){cf=c.dataset.c;renderMatches();}

});

<script>
/* Orqaga tugmasi: saytdan to'g'ridan-to'g'ri chiqib ketmasdan, tasdiq so'raydi */
(function(){
  try{if(!history.state)history.replaceState({root:1},"")}catch(e){}
  const X=document.createElement("div");X.className="xo";X.hidden=true;
  X.innerHTML='<div class="xb" role="dialog" aria-modal="true"><h3></h3><p></p><div class="r"><button class="y" data-x="stay"></button><button data-x="leave"></button></div></div>';
  document.body.appendChild(X);
  const q=x=>X.querySelector(x),ru=()=>typeof lang!=="undefined"&&lang==="ru";
  function txt(){const r=ru();q("h3").textContent=r?"Закрыть страницу?":"Sahifani yopasizmi?";
    q("p").textContent=r?"Вы действительно хотите покинуть сайт?":"Rostan ham saytdan chiqmoqchimisiz?";
    q(".y").textContent=r?"Нет, остаться":"Yo'q, qolaman";q("[data-x=leave]").textContent=r?"Да, выйти":"Ha, chiqaman";}
  const guard=()=>{try{history.pushState({g:1},"",location.href)}catch(e){}};
  let armed=false;
  const arm=()=>{if(armed)return;armed=true;guard();};
  ["pointerdown","keydown","touchstart"].forEach(t=>addEventListener(t,arm,{once:true,passive:true}));
  addEventListener("popstate",e=>{
    if(!armed||!(e.state&&e.state.root))return;
    const mo=document.getElementById("mo");
    guard();
    if(mo&&!mo.hidden&&typeof closeMatch==="function"){closeMatch();return;}
    txt();X.hidden=false;q(".y").focus();
  });
  X.addEventListener("click",e=>{
    const b=e.target.closest("[data-x]");
    if(b&&b.dataset.x==="leave"){
      X.hidden=true;
      try{if(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.initData){Telegram.WebApp.close();return;}}catch(_){}
      history.go(-2);setTimeout(()=>{try{window.close()}catch(_){}},500);
    }else if(b||e.target===X)X.hidden=true;
  });
  addEventListener("keydown",e=>{if(e.key==="Escape"&&!X.hidden)X.hidden=true;});
})();
</script>
