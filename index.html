*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit}

img{width:22px;height:22px;object-fit:contain;flex:none}

.bar{max-width:1080px;margin:0 auto;padding:0 16px;height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px}

.chips{display:flex;flex-wrap:wrap;gap:8px;padding:8px 16px}
.chip{border:1px solid var(--line);background:none;color:var(--mu);padding:7px 14px;border-radius:99px;white-space:nowrap}
.chip.on{background:var(--ac);border-color:var(--ac);color:#052015;font-weight:700}
.chip i{font-style:normal;opacity:.7;margin-left:4px;font-size:12px}
.lg,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:10px 16px;overflow:hidden}
.card{padding:4px 0}
.lgh{display:flex;align-items:center;gap:10px;padding:12px 14px;font-size:15px;background:linear-gradient(90deg,rgba(47,120,214,.22),transparent 70%)}
.lgh em{font-style:normal;color:var(--live);font-size:13px;font-weight:700}
.m{position:relative;display:grid;grid-template-columns:1fr 72px 1fr;align-items:center;gap:8px;padding:12px;border-top:1px solid var(--line)}
.m.lv::before{content:"";position:absolute;left:0;top:12%;bottom:12%;width:4px;border-radius:0 4px 4px 0;background:var(--live)}
.t{display:flex;align-items:center;gap:8px;min-width:0}

.hero{display:block;position:relative;margin:10px 16px;border-radius:20px;overflow:hidden;height:230px;color:#fff;text-decoration:none;background:#000}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .ov{position:absolute;inset:0;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(transparent 30%,rgba(0,0,0,.88))}

.chip.lgl{display:inline-flex;align-items:center;justify-content:center;min-width:64px;height:48px;padding:6px 14px}
.chip.lgl img{height:32px;width:auto;max-width:84px;object-fit:contain;display:block}
.chip.lgl.on{background:rgba(47,208,138,.14);border-color:var(--ac);box-shadow:0 4px 16px rgba(47,208,138,.25)}
.lgcap{margin:10px 16px 2px;font-weight:700}
.grp{margin:14px 16px 2px;color:var(--mu);font-size:13px;font-weight:700}
.lg,.card{border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.035),transparent),var(--card);transition:border-color .2s,box-shadow .2s}
.lg:hover,.card:hover{border-color:#2d4271;box-shadow:0 10px 30px rgba(0,0,0,.22)}
.ncard,.nhero{transition:transform .25s,box-shadow .25s,border-color .25s}
.ncard:hover{transform:translateY(-4px);box-shadow:0 14px 34px rgba(0,0,0,.3)}
.nhero:hover{transform:translateY(-2px);box-shadow:0 18px 44px rgba(47,208,138,.18)}
.nhero>img,.nimg img{transition:transform .5s;object-position:50% 28%}
.nhero:hover>img,.ncard:hover .nimg img{transform:scale(1.06)}
.nimg{background:linear-gradient(135deg,#1b4a5c,#17335a 55%,#2a1d57)}
.nhero .ov{background:linear-gradient(transparent 20%,rgba(5,10,22,.92))}
.pt{background:linear-gradient(90deg,var(--tx),var(--mu));-webkit-background-clip:text;background-clip:text;color:transparent}
.mcard{background:linear-gradient(135deg,rgba(47,208,138,.1),transparent),var(--card)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.xo{position:fixed;inset:0;z-index:99;background:rgba(5,10,22,.72);backdrop-filter:blur(6px);display:grid;place-items:center;padding:20px}
.xo[hidden]{display:none}
.xb{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:26px 22px 22px;max-width:340px;width:100%;text-align:center;box-shadow:0 24px 60px rgba(0,0,0,.5)}
.xb h3{margin:0 0 6px;font-size:21px}
.xb p{margin:0 0 20px;color:var(--mu)}
.xb .r{display:grid;gap:10px}
.xb button{padding:12px 16px;border-radius:99px;border:1px solid var(--line);background:none;color:var(--tx);font-weight:700;transition:transform .2s,box-shadow .2s}
.xb button:hover{transform:translateY(-1px)}
.xb .y{background:var(--ac);border-color:var(--ac);color:#052015}
.xb .y:hover{box-shadow:0 6px 20px rgba(47,208,138,.38)}
.tvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:14px}
.tvc{display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--tx);font-weight:600;text-align:left;cursor:pointer;transition:transform .2s,border-color .2s}
.tvc span{color:var(--ac)}
.tvc:hover{transform:translateY(-2px);border-color:var(--ac)}
.tvhero{display:flex;align-items:center;gap:16px;padding:22px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(135deg,rgba(47,208,138,.12),transparent),var(--card);margin-top:14px}
.tvplay{width:64px;height:64px;border-radius:50%;border:0;background:var(--ac);color:#052015;font-size:26px;cursor:pointer;transition:transform .2s,box-shadow .2s}
.tvplay:hover{transform:scale(1.06);box-shadow:0 8px 24px rgba(47,208,138,.4)}
.tvhero small{display:block;color:var(--mu)}
.tvgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:12px 16px}
.tvcard{display:flex;align-items:center;gap:12px;width:100%;padding:12px 16px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(135deg,rgba(47,208,138,.12),transparent),var(--card);color:var(--tx);font:inherit;text-align:left;cursor:pointer;transition:transform .2s,border-color .2s,box-shadow .2s}
.tvcard:hover{transform:translateY(-2px);border-color:var(--ac);box-shadow:0 8px 24px rgba(47,208,138,.18)}
.tvcard .tvn{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--ac);color:#052015;font:900 18px system-ui}
.tvcard b{display:block;font-size:15px;white-space:nowrap}
.tvcard small{display:block;margin-top:1px;font-size:13px;white-space:nowrap;color:var(--mu)}
.tvcard small i{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff3b3b;margin-right:6px}
.tvcard.off{opacity:.5;cursor:default}
.tvcard.off:hover{transform:none;border-color:var(--line);box-shadow:none}

/* === TV bo'limi: yangi kartalar dizayni (tomoshabinlar soni ko'rsatilmaydi) === */
.tvsub{margin:2px 16px 0;font-size:14px;color:var(--mu)}
.tvgrid{grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;margin:14px 16px}
.tvcard{--c:#3b82f6;flex-direction:column;align-items:stretch;gap:0;padding:0;overflow:hidden;border-radius:18px;background:var(--card)}
.tvcard.c2{--c:#22c55e}.tvcard.c3{--c:#f97316}.tvcard.c4{--c:#a855f7}
.tvcard:hover{border-color:var(--c);box-shadow:0 10px 28px color-mix(in srgb,var(--c) 30%,transparent)}
.tvst{position:relative;display:grid;place-items:center;height:128px;background:color-mix(in srgb,var(--c) 20%,var(--card));border-bottom:1px solid var(--line)}
.tvpitch{position:absolute;inset:0;width:100%;height:100%}
.tvpitch *{fill:none;stroke:#fff;stroke-opacity:.16;stroke-width:2}
.tvbdg{position:relative;z-index:1;padding:8px 20px;border-radius:12px;border:1.5px solid var(--c);background:color-mix(in srgb,var(--card) 80%,transparent);color:var(--tx);font:800 26px/1 system-ui;letter-spacing:1px}
.tvcard.off .tvbdg{border-color:var(--mu);color:var(--mu)}
.tvlive{position:absolute;top:10px;left:10px;display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:#e5484d;color:#fff;font:800 11px/1 system-ui;letter-spacing:.8px}
.tvlive i{width:6px;height:6px;border-radius:50%;background:#fff;animation:tvdot 1.3s infinite}
@keyframes tvdot{50%{opacity:.25}}
.tvpl{position:absolute;right:10px;bottom:10px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#fff;color:#0b1220;transition:transform .2s}
.tvpl svg{width:18px;height:18px;fill:currentColor;margin-left:2px}
.tvcard:hover .tvpl{transform:scale(1.12)}
.tvin{display:block;padding:12px 14px 14px}
.tvin b{font-size:15px}
.tvin small{margin-top:3px;font-size:13px}
.tvin small{overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tvnow{color:var(--tx)!important}
.tvnow em{font-style:normal;font-weight:800;font-size:11px;letter-spacing:.5px;color:var(--c);margin-right:4px;text-transform:uppercase}
.tvbar{display:block;height:3px;border-radius:2px;background:var(--line);margin:7px 0 6px;overflow:hidden}
.tvbar u{display:block;height:100%;background:var(--c);border-radius:2px}
.tvnext{font-size:12px!important}
.tvmatch{position:absolute;left:10px;right:58px;bottom:10px;z-index:1;padding:5px 9px;border-radius:8px;background:rgba(8,12,22,.62);color:#fff;font:700 12px/1.2 system-ui;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tvcard.off .tvst{background:color-mix(in srgb,var(--mu) 14%,var(--card))}
.tvcard.off .tvlive{background:var(--mu)}
.tvcard.off .tvlive i{animation:none;opacity:.6}
.tvcard.off .tvpl{display:none}
@media(max-width:520px){.tvgrid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:12px 12px}.tvst{height:104px}.tvbdg{font-size:20px;padding:6px 14px}.tvin{padding:10px 11px 12px}.tvin b{font-size:13px;white-space:normal}.tvsub{margin-left:12px}}
.tvb{display:inline-flex;align-items:center;gap:8px;margin-left:auto;padding:9px 14px 9px 12px;border-radius:99px;font-weight:800;font-size:13px;letter-spacing:.3px;color:#fff;background:linear-gradient(135deg,#e5484d,#ff7a45);box-shadow:0 6px 18px rgba(229,72,77,.35);transition:transform .2s,box-shadow .2s}
.tvb svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tvb .lv{width:8px;height:8px;border-radius:50%;background:#fff;animation:lvp 1.4s infinite}
@keyframes lvp{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.tvb:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(229,72,77,.5)}
.tvb.on{box-shadow:0 0 0 2px rgba(255,255,255,.4),0 6px 18px rgba(229,72,77,.35)}
@media(max-width:640px){.tvb span{display:none}.tvb{padding:9px}}

/* ===== menyu: yangi dizayn ===== */
.bar nav{margin:0 auto;gap:2px;padding:4px;background:var(--bg);border:1px solid var(--line);border-radius:99px}
.bar nav a{display:inline-flex;align-items:center;gap:7px;padding:8px 16px;border-radius:99px;color:var(--mu);font-weight:600;font-size:14px;box-shadow:none;transform:none;transition:background .25s,color .25s}
.bar nav a svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bar nav a:not(.tgb):hover,[data-theme="light"] .bar nav a:not(.tgb):hover{background:color-mix(in srgb,var(--ac) 10%,transparent);color:var(--tx);transform:none;box-shadow:none}
.bar nav a.on,.bar nav a.on:not(:hover){background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 70%,#2a7fff));color:#052015;font-weight:800;box-shadow:0 4px 14px color-mix(in srgb,var(--ac) 40%,transparent)}
.bar nav a.tgb{border:0;margin-left:2px;padding-left:14px;border-left:1px solid var(--line);border-radius:0 99px 99px 0;color:#37aee2}
.bar nav a.tgb:hover{background:color-mix(in srgb,#37aee2 14%,transparent);color:#37aee2;transform:none;box-shadow:none}
.tvb,.tvb:hover{text-decoration:none}
.tvb{margin-left:0;padding:8px 15px 8px 12px;gap:7px;font-size:14px;font-weight:900;letter-spacing:1.5px}

  else if(e.scoringPlay||(/\bgoal\b|penalty - scored/.test(tx)&&!/disallow|no goal/.test(tx)))k=(e.penaltyKick||tx.includes("penalty"))?"pg":"g";
  else if(e.redCard||tx.includes("red card"))k="r";

const SX={};
const DEBUG=/[?&]debug/.test(location.search);
const CORE="https://sports.core.api.espn.com/v2/sports/soccer/leagues/";
const TSD="https://www.thesportsdb.com/api/v1/json/3/";
const tidOf=r=>{const x=String((r&&r.$ref)||"").match(/teams\/(\d+)/);return x?x[1]:"";};
const nz=x=>String(x||"").toLowerCase().replace(/[^a-z0-9]/g,"");
const TSN={"Yellow Cards":"yellowCards","Red Cards":"redCards","Offsides":"offsides","Corner Kicks":"wonCorners","Fouls":"foulsCommitted","Shots on Goal":"shotsOnTarget","Total Shots":"totalShots","Shots Total":"totalShots","Ball Possession":"possessionPct","Saves":"saves","Goalkeeper Saves":"saves"};
async function coreFetch(m){
  const eid=m.id.slice(1),base=`${CORE}${m.slug}/events/${eid}/competitions/${eid}`,out={ev:[],st:{h:{},a:{}},dbg:[]};
  try{
    const dj=await jget(`${base}/details?limit=300&_=${Date.now()}`,8000);
    out.ev=(dj.items||[]).map(e=>normEv(Object.assign({},e,{team:{id:tidOf(e.team)}}),m)).filter(Boolean);
    out.dbg.push("core voqea: "+(dj.items||[]).length+" xom / "+out.ev.length+" tushunildi");
  }catch(e){out.dbg.push("core voqea xato: "+(e.message||e.name));}
  await Promise.all([[m.hid,"h"],[m.aid,"a"]].map(async([tid,sd])=>{
    if(!tid)return;
    try{
      const j=await jget(`${base}/competitors/${tid}/statistics?_=${Date.now()}`,8000);
      ((j.splits||{}).categories||[]).forEach(c=>(c.stats||[]).forEach(z=>{if(z.name&&z.displayValue!=null)out.st[sd][z.name]=String(z.displayValue).replace("%","");}));
      out.dbg.push("core stat "+sd+": "+Object.keys(out.st[sd]).length);
    }catch(e){out.dbg.push("core stat "+sd+" xato: "+(e.message||e.name));}
  }));
  return out;
}
async function tsdFetch(m){
  const out={ev:[],st:{h:{},a:{}},dbg:[]},days=[...new Set([m.utc.slice(0,10),dkey(m.utc)])];
  let ev=null,swap=false;
  for(const dy of days){
    try{
      const j=await jget(`${TSD}eventsday.php?d=${dy}&s=Soccer`,8000);
      for(const e of (j.events||[])){
        const H=nz(e.strHomeTeam),A=nz(e.strAwayTeam),h=nz(m.h),a=nz(m.a);
        const ok=(x,y)=>x&&y&&(x.includes(y)||y.includes(x));
        if(ok(H,h)&&ok(A,a)){ev=e;swap=false;break;}
        if(ok(H,a)&&ok(A,h)){ev=e;swap=true;break;}
      }
    }catch(e){out.dbg.push("tsd kun xato: "+(e.message||e.name));}
    if(ev)break;
  }
  if(!ev){out.dbg.push("tsd: o'yin topilmadi");return out;}
  out.dbg.push("tsd: o'yin topildi");
  try{
    const j=await jget(`${TSD}lookuptimeline.php?id=${ev.idEvent}`,8000);
    out.ev=(j.timeline||[]).map(t=>{
      const tl=String(t.strTimeline||"").toLowerCase(),dt=String(t.strTimelineDetail||"").toLowerCase();
      let k="";
      if(tl==="goal")k=dt.includes("own")?"og":dt.includes("pen")?"pg":"g";
      else if(tl==="card")k=dt.includes("red")?"r":"y";
      else if(tl.startsWith("subst"))k="s";
      if(!k)return null;
      let sd=String(t.strHome).toLowerCase()==="yes"?"h":"a";if(swap)sd=sd==="h"?"a":"h";
      const p=[t.strPlayer,k==="s"?t.strAssist:""].filter(Boolean);
      return {k,so:false,t:t.intTime?t.intTime+"'":"",s:sd,p};
    }).filter(Boolean);
    out.dbg.push("tsd voqea: "+out.ev.length);
  }catch(e){out.dbg.push("tsd voqea xato: "+(e.message||e.name));}
  try{
    const j=await jget(`${TSD}lookupeventstats.php?id=${ev.idEvent}`,8000);
    (j.eventstats||[]).forEach(z=>{
      const k=TSN[z.strStat];if(!k)return;
      let a=String(z.intHome??"").replace("%",""),b=String(z.intAway??"").replace("%","");
      if(swap)[a,b]=[b,a];
      out.st.h[k]=a;out.st.a[k]=b;
    });
    out.dbg.push("tsd stat: "+Object.keys(out.st.h).length);
  }catch(e){out.dbg.push("tsd stat xato: "+(e.message||e.name));}
  return out;
}

const nfm=(x,f)=>f==="*"||(f==="report"?(x.kind==="report"||x.kind==="recap"):x.kind===f);
function renderNews(){
  const all=(news||[]).filter(x=>x.kind==="news");if(!all.length)return;
  if(q){const r=all.filter(x=>((x.title||"")+" "+(x.text||"")).toLowerCase().includes(q));
    $("#news").innerHTML=`<div class="crumb">${T("home")} › <b>${T("searchT")}</b> <i>•</i> ${r.length}</div>`+(r.length?`<div class="ngrid">${r.map(ncard).join("")}</div>`:`<div class="empty">${T("nothing")}</div>`);return;}
  const a=all.filter(x=>nfm(x,nf));
  if(nf==="news")a.sort((x,y)=>(x.ord||0)-(y.ord||0));
  if(!a.length){$("#news").innerHTML=`<div class="empty">${lang==="ru"?"Пока нет материалов":"Hozircha maqola yo'q"}</div>`;return;}
  const hi=a.slice(0,4).findIndex(x=>x.img),f=a[hi>0?hi:0],rest=a.filter(x=>x!==f);
  let h=nhead(a.length)+`<div class="nwrap"><a class="nhero" href="#" data-n="${esc(f.id)}">${f.img?imgT(f.img,1280,'fetchpriority="high"'):""}<div class="ov"><div class="nbadges"><span class="hot">🔥 ${lang==="ru"?"Главное":"Kun xabari"}</span>${sp(f)}</div><h2>${esc(f.title)}</h2>${f.text?`<p>${esc(f.text)}</p>`:""}<small>${when(f.date)}</small></div></a>`
    +`<div class="nside">${rest.slice(0,4).map((x,i)=>ncard(x,i+1)).join("")}</div></div>`;
  if(rest.length>4)h+=`<div class="more">${T("more")}</div><div class="ngrid">${rest.slice(4).map((x,i)=>ncard(x,i)).join("")}</div>`;
  $("#news").innerHTML=h;
}

  M.forEach(m=>m.comp=LN(m.slug));cf="*";applyStatic();renderMatches();renderTable();renderNews();if(curM)paintModal();};

  const mtb=e.target.closest("[data-mt]"),ftb=e.target.closest("[data-ft]");
  if(mtb){mTab=mtb.dataset.mt;paintModal();if(curM)setUrl(matchPath(curM,mTab));return;}

  if(d){day=d.dataset.d==="live"?"live":+d.dataset.d;cf="*";renderMatches();setUrl(tabPath("oyinlar"));}
  else if(c){cf=c.dataset.c;renderMatches();}
  else if(l){lg=l.dataset.l;try{sessionStorage.setItem("lg",lg);}catch(e){}loadTable(lg);setUrl(tabPath("jadval"));}
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape"&&(curM||curN))closeMatch();
  else if((e.key==="Enter"||e.key===" ")&&e.target.matches&&e.target.matches(".m[data-m]")){e.preventDefault();openMatch(e.target.dataset.m);}
});
/* HAVOLALAR (onsports.uz/...): har bir sahifa/o'yin/xabar/jadval o'z manziliga ega.
   /  /oyinlar  /oyinlar/kun/1  /oyin/401234  /xabar/ab12cd  /jadval/esp.1  /tv      (eski #oyinlar/... havolalar ham ishlaydi) */
const TABN=window.__TG?["yangilik","oyinlar","jadval"]:["yangilik","oyinlar","jadval","tv"];
/* o'qiladigan havola: nomni lotinchaga o'giramiz (arsenal-chelsi, kiril ham) */
const CYR={"а":"a","б":"b","в":"v","г":"g","д":"d","е":"e","ё":"yo","ж":"j","з":"z","и":"i","й":"y","к":"k","л":"l","м":"m","н":"n","о":"o","п":"p","р":"r","с":"s","т":"t","у":"u","ф":"f","х":"x","ц":"ts","ч":"ch","ш":"sh","щ":"sh","ъ":"","ы":"i","ь":"","э":"e","ю":"yu","я":"ya","ў":"o","қ":"q","ғ":"g","ҳ":"h"};
function slug(t,n){return String(t||"").toLowerCase().replace(/[\u0400-\u04ff]/g,c=>CYR[c]??"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[ʻʼ`'’]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,n||60);}
const MTU={st:"statistika",ev:"voqealar",h2h:"yuzma-yuz",fm:"forma"},MTR=Object.fromEntries(Object.entries(MTU).map(([k,v])=>[v,k]));
function matchPath(id,t){const m=(M||[]).find(x=>x.id===id);return "/oyin/"+encodeURIComponent(id)+(m?"/"+slug(tn(m.h)+" "+tn(m.a)):"")+(m&&t&&MTU[t]?"/"+MTU[t]:"");}
function newsPath(id){const x=(news||[]).find(n=>n.id===id);return "/xabar/"+encodeURIComponent(id)+(x&&x.title?"/"+slug(x.title,70):"");}
const BASE=(()=>{if(!/\.github\.io$/.test(location.hostname))return"";const q=location.pathname.split("/")[1]||"";return q&&q!=="index.html"&&!["oyin","xabar"].concat(TABN).includes(q)?"/"+q:"";})();
const dec=x=>{try{return decodeURIComponent(x)}catch(e){return x}};
function curTab(){const t=document.querySelector(".tab:not([hidden])");return t?t.id:"yangilik";}
function setUrl(path){try{const u=BASE+path+location.search;if(location.pathname+location.search+location.hash!==u)history.replaceState(history.state,"",u);}catch(e){}}
function tabPath(t){t=t||curTab();if(t==="jadval")return "/jadval/"+encodeURIComponent(lg);
  if(t==="oyinlar"&&String(day)!=="0")return "/oyinlar/kun/"+encodeURIComponent(day);return t==="yangilik"?"/":"/"+t;}
function parsePath(){let pa=location.pathname;if(BASE&&pa.indexOf(BASE)===0)pa=pa.slice(BASE.length);
  const p=pa.split("/").filter(Boolean).map(dec);if(!p.length)return null;
  if(p[0]==="oyin"&&p[1])return{tab:"oyinlar",oyin:p[1],mt:MTR[p[3]]};
  if(p[0]==="xabar"&&p[1])return{tab:"yangilik",xabar:p[1]};
  if(!TABN.includes(p[0]))return null;
  const o={tab:p[0]};if(p[0]==="oyinlar"&&p[1]==="kun"&&p[2]!==undefined)o.kun=p[2];if(p[0]==="jadval"&&p[1])o.liga=p[1];return o;}
function parseHash(){const p=(location.hash||"").slice(1).split("/").map(dec);
  if(!TABN.includes(p[0]))return null;const o={tab:p[0]};for(let i=1;i+1<p.length;i+=2)o[p[i]]=p[i+1];return o;}
const parseRoute=()=>parsePath()||parseHash();
let _pend=null,_pendT=null;
function applyRoute(){
  const r=parseRoute();
  if(!r){if(curM||curN)closeMatch();showTab("yangilik");return;}
  if(r.kun!==undefined)day=r.kun==="live"?"live":(["-1","0","1"].includes(r.kun)?+r.kun:0);
  if(r.liga!==undefined&&r.tab==="jadval"&&TABS.indexOf(r.liga)>=0){lg=r.liga;try{sessionStorage.setItem("lg",lg);}catch(e){}}
  if(!r.oyin&&!r.xabar&&(curM||curN))closeMatch();
  showTab(r.tab);
  if(r.tab==="oyinlar"){try{renderMatches();}catch(e){}}
  if(r.tab==="jadval"){try{loadTable(lg);}catch(e){}}
  /* o'yin / xabar oynasi: ma'lumot yuklanguncha (20 soniyagacha) kutiladi */
  const want=r.oyin?{m:r.oyin,t:r.mt}:r.xabar?{n:r.xabar}:null;
  clearInterval(_pendT);_pend=want;if(!want)return;
  let tries=0;_pendT=setInterval(()=>{tries++;
    if(want.m&&(M||[]).find(x=>x.id===want.m)){clearInterval(_pendT);if(curM!==want.m)openMatch(want.m,want.t);}
    else if(want.n&&(news||[]).find(x=>x.id===want.n)){clearInterval(_pendT);if(curN!==want.n)openNews(want.n);}
    else if(tries>40){clearInterval(_pendT);setUrl(tabPath(r.tab));}},500);
}
addEventListener("hashchange",()=>{if(parseHash())applyRoute();});
function showTab(t){if(window.__TG&&t==="tv")t="yangilik";if(!document.querySelector(".tab#"+t))t="yangilik";document.querySelectorAll(".tab").forEach(x=>x.hidden=x.id!==t);
  document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("on",x.dataset.tab===t));window.scrollTo(0,0);if(t==="tv")loadTV();
  /* yangilanganda shu menyuda qolish uchun: manzildagi # va sessiyada saqlanadi (tarix yozuvi qo'shilmaydi) */
  try{sessionStorage.setItem("tab",t);}catch(e){}
  if(!(curM||curN))setUrl(tabPath(t));}
(function(){try{const l=sessionStorage.getItem("lg");if(l&&TABS.indexOf(l)>=0)lg=l;}catch(e){}
  applyRoute();})();
try{news=JSON.parse(localStorage.getItem("news3")||"null");if(news){newsSig=news.map(x=>x.id).join();renderNews();enrichImgs();}}catch(e){}
if(!news||!news.some(x=>x.kind==="news")){news=SEED.concat((news||[]).filter(x=>x.kind!=="news"));newsSig="";renderNews();enrichImgs();}
loadNews();renderMatches();setTimeout(()=>{loadAll();loadTable(lg);},0);
let _tk=0,_sk=0;
setInterval(()=>{
  if(document.hidden)return;
  _tk++;
  const el=$("#oyinlar"),onM=curM||(el&&!el.hidden);
  if(!onM&&_tk%10)return;                                                              /* boshqa bo'limda — 10 soniyada bir marta */
  if(window.__lf>0&&++_sk<Math.min(10,Math.pow(2,window.__lf)))return;_sk=0;            /* ESPN xato bersa vaqtincha sekinlashadi */
  const lv=M.filter(isLive);

  if(lv.length){[...new Set(lv.map(m=>m.slug))].forEach(sl=>{if(window.__lb[sl])return;window.__lb[sl]=1;loadLeague(sl).finally(()=>{window.__lb[sl]=0;});});}
  if(!window.__t||Date.now()-window.__t>6e4){window.__t=Date.now();loadAll();}      /* qolgan ligalar — daqiqada bir marta */
},LIVE_MS);
setInterval(()=>{if(document.hidden)return;const el=$("#jadval");if(el&&!el.hidden)loadTable(lg);},TBL_MS);
setInterval(loadNews,6e5);
let lastLiveN=-1;setInterval(()=>{const n=M.filter(isLive).length;if(lastLiveN!==-1&&n!==lastLiveN&&!curM&&$("#oyinlar")&&!$("#oyinlar").hidden)renderMatches();lastLiveN=n;},30000);
</script>
<script>
/* Orqaga tugmasi: saytdan to'g'ridan-to'g'ri chiqib ketmasdan, tasdiq so'raydi */
(function(){
  try{if(!history.state)history.replaceState({root:1},"")}catch(e){}
  const X=document.createElement("div");X.className="xo";X.hidden=true;
  X.innerHTML='<div class="xb" role="dialog" aria-modal="true"><h3></h3><p></p><div class="r"><button class="y" data-x="stay"></button><button data-x="leave"></button></div></div>';
  document.body.appendChild(X);
  const q=x=>X.querySelector(x),ru=()=>typeof lang!=="undefined"&&lang==="ru";
  function txt(){const r=ru();q("h3").textContent=r?"Закрыть страницу?":"Sahifani yopasizmi?";
    q("p").textContent=r?"Вы действительно хотите покинуть сайт?":"Rostan ham saytdan chiqmoqchimisiz?";
    q(".y").textContent=r?"Нет, остаться":"Yo'q, qolaman";q("[data-x=leave]").textContent=r?"Да, выйти":"Ha, chiqaman";}
  const guard=()=>{try{history.pushState({g:1},"",location.href)}catch(e){}};
  let armed=false;
  const arm=()=>{if(armed)return;armed=true;guard();};
  ["pointerdown","keydown","touchstart"].forEach(t=>addEventListener(t,arm,{once:true,passive:true}));
  let leaving=false;
  if(window.__exitTry){setTimeout(()=>{const t=document.createElement("div");t.textContent=ru()?"Для выхода нажмите «Назад» ещё раз":"Chiqish uchun «Orqaga» tugmasini yana bir marta bosing";
    t.style.cssText="position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#131c30;color:#eef2fa;border:1px solid #22304d;border-radius:12px;padding:10px 16px;font:600 14px system-ui;z-index:100000;text-align:center;max-width:90%";
    document.body.appendChild(t);setTimeout(()=>t.remove(),3500);},700);}
  addEventListener("popstate",e=>{
    if(leaving||!armed||!(e.state&&e.state.root))return;
    const mo=document.getElementById("mo");
    guard();
    if(mo&&!mo.hidden&&typeof closeMatch==="function"){closeMatch();return;}
    txt();X.hidden=false;q(".y").focus();
  });
  X.addEventListener("click",e=>{
    const b=e.target.closest("[data-x]");
    if(b&&b.dataset.x==="leave"){
      X.hidden=true;
      try{if(window.Telegram&&Telegram.WebApp&&Telegram.WebApp.initData){Telegram.WebApp.close();return;}}catch(_){}
      const sa=matchMedia("(display-mode: standalone)").matches||navigator.standalone||document.referrer.indexOf("android-app://")===0;
      if(sa){   /* APK/PWA: tarixni 1 ta yozuvga tushirib, oynani yopamiz */
        leaving=true;let done=false;
        try{sessionStorage.setItem("onsx","1")}catch(_){}
        const go=()=>{if(done)return;done=true;location.replace("/")};
        addEventListener("popstate",go,{once:true});setTimeout(go,500);
        history.go(-1);return;
      }
      history.go(-2);setTimeout(()=>{try{window.close()}catch(_){}},500);
    }else if(b||e.target===X)X.hidden=true;
  });
  addEventListener("keydown",e=>{if(e.key==="Escape"&&!X.hidden)X.hidden=true;});
})();
</script>
