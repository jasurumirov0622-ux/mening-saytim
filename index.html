<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ONSPORTS.UZ — futbol natijalari va yangiliklar</title>
<meta name="description" content="ONSPORTS.UZ: jonli futbol natijalari, o'yinlar jadvali, liga turnir jadvallari va yangiliklar o'zbek tilida.">
<style>
:root{--bg:#0b1220;--card:#131c30;--line:#22304d;--tx:#eef2fa;--mu:#8a98b5;--ac:#2fd08a;--live:#ff5a5f}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
img{width:22px;height:22px;object-fit:contain;flex:none}
header{position:sticky;top:0;z-index:5;background:rgba(11,18,32,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1080px;margin:0 auto;padding:0 16px;height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-size:22px;font-weight:800;text-decoration:none}
.logo span{color:var(--ac)}
.bar nav{display:flex;gap:6px;align-items:center}
.bar nav a{padding:7px 14px;border-radius:99px;text-decoration:none;color:var(--mu);font-weight:600;font-size:14px}
.bar nav a:hover{color:var(--tx);background:var(--card)}
.bar nav a.tgb{border:1px solid var(--ac);color:var(--ac)}
.bar nav a.tgb:hover{background:var(--ac);color:#052015}
.pt{margin:18px 16px 4px;font-size:24px}
.pt small{display:block;color:var(--mu);font:600 12px system-ui;letter-spacing:1px;margin-top:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:none;color:var(--mu);padding:7px 14px;border-radius:99px;white-space:nowrap}
.chip.on{background:var(--ac);border-color:var(--ac);color:#052015;font-weight:700}
.chip i{font-style:normal;opacity:.7;margin-left:4px;font-size:12px}
.lg,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:10px 16px;overflow:hidden}
.card{padding:4px 0}
.lgh{display:flex;align-items:center;gap:10px;padding:12px 14px;font-size:15px;background:linear-gradient(90deg,rgba(47,120,214,.22),transparent 70%)}
.lgh em{font-style:normal;color:var(--live);font-size:13px;font-weight:700}
.m{position:relative;display:grid;grid-template-columns:1fr 72px 1fr;align-items:center;gap:8px;padding:12px;border-top:1px solid var(--line)}
.m.lv::before{content:"";position:absolute;left:0;top:12%;bottom:12%;width:4px;border-radius:0 4px 4px 0;background:var(--live)}
.t{display:flex;align-items:center;gap:8px;min-width:0}
.t.r{justify-content:flex-end;text-align:right}
.t b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.c{text-align:center;font-size:20px;font-weight:800;line-height:1.15;padding:9px 6px;border-radius:16px;background:#1a2338;border:1px solid var(--line);font-variant-numeric:tabular-nums}
.c small{display:block;margin-top:3px;font-size:12px;font-weight:600;color:var(--mu)}
.c.live{background:#2b1a27;border-color:#3d2234}
.c.live small{color:var(--live)}
.empty{text-align:center;color:var(--mu);padding:40px 16px}
h3.sec{margin:16px 16px 6px;font-size:14px;color:var(--mu);font-weight:600}
.row{display:grid;grid-template-columns:24px 1fr 28px 34px 34px;align-items:center;gap:8px;margin:0 16px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row.h{color:var(--mu);font-size:12px}
.row .n{display:flex;align-items:center;gap:8px;min-width:0}
.row .n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row>*:nth-child(n+3){text-align:right}
.hero{display:block;position:relative;margin:10px 16px;border-radius:20px;overflow:hidden;height:230px;color:#fff;text-decoration:none;background:#000}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .ov{position:absolute;inset:0;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(transparent 30%,rgba(0,0,0,.88))}
.hero h2{margin:4px 0 0;font-size:20px;line-height:1.25}
.nr{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);text-decoration:none}
.nr:last-child{border:0}
.nr div{flex:1}
.nr h4{margin:4px 0 0;font-size:15px;line-height:1.3}
.nr img.th{width:64px;height:64px;border-radius:10px;object-fit:cover}
.nr small,.hero small{font-size:12px;color:var(--mu)}
.nr small b,.hero small b{color:var(--ac)}
.hero small{color:#ffffffb0}
.tgcta{display:block;margin:10px 16px;padding:18px;border-radius:22px;background:linear-gradient(135deg,#0f5a44,#12233a 75%);border:1px solid var(--line);text-decoration:none}
.tgcta b{display:block;font-size:18px}
.tgcta span{color:#b7c6d6;font-size:14px}
footer{border-top:1px solid var(--line);color:var(--mu);text-align:center;padding:22px 16px;font-size:13px}
.page{max-width:760px;margin:0 auto;padding:8px 0 60px}
.tab[hidden]{display:none}
.bar nav a.on{background:var(--card);color:var(--tx)}
.err{color:var(--mu);font-size:12px;margin-top:8px}
@media(max-width:640px){.bar nav a{padding:7px 10px;font-size:13px}.logo{font-size:19px}.bar{gap:6px}}
</style>
</head>
<body>
<header><div class="bar">
  <a class="logo" href="#"><span>ONSPORTS</span>.UZ</a>
  <nav><a href="#oyinlar" data-tab="oyinlar" class="on">O'yinlar</a><a href="#jadval" data-tab="jadval">Jadval</a><a href="#yangilik" data-tab="yangilik">Yangiliklar</a><a class="tgb" href="https://t.me/onsportsuz" target="_blank" rel="noopener">Telegram</a></nav>
</div></header>

<div class="page">
  <main>
    <section id="oyinlar" class="tab">
      <h2 class="pt">O'yinlar<small>ONSPORTS.UZ</small></h2>
      <div class="chips" id="days"></div>
      <div class="chips" id="comps"></div>
      <div id="out"><div class="empty">Yuklanmoqda…</div></div>
    </section>
    <section id="jadval" class="tab" hidden>
      <h2 class="pt">Turnir jadvali</h2>
      <div class="chips" id="lgs"></div>
      <div class="card" id="tbl"><div class="empty">Yuklanmoqda…</div></div>
    </section>
    <section id="yangilik" class="tab" hidden>
      <h2 class="pt">Yangiliklar<small>ONSPORTS.UZ GAZETA</small></h2>
      <div id="news"><div class="empty">Yuklanmoqda…</div></div>
    </section>
  </main>
  <a class="tgcta" href="https://t.me/onsportsuz" target="_blank" rel="noopener"><b>@onsportsuz</b><span>Natijalar va yangiliklar Telegram kanalimizda</span></a>
</div>
<footer>© 2026 ONSPORTS.UZ</footer>

<script>
const ESPN="https://site.api.espn.com/apis/site/v2/sports/soccer/";
const ESPN2="https://site.api.espn.com/apis/v2/sports/soccer/";
const TZ="Asia/Tashkent";
const LEAGUES=[["uzb.1","O'zbekiston Superligasi"],["uefa.champions","Champions League"],["eng.1","Premier League"],["esp.1","La Liga"],["ita.1","Serie A"],["ger.1","Bundesliga"],["fra.1","Ligue 1"],["uefa.europa","Europa League"],["uefa.europa.conf","Conference League"],["uefa.nations","UEFA Nations League"],["afc.champions","AFC Champions League Elite"],["afc.cup","AFC Champions League Two"],["fifa.friendly","International Friendly"],["tur.1","Turkish Super Lig"],["ned.1","Eredivisie"],["por.1","Liga Portugal"],["ksa.1","Saudi Pro League"],["usa.1","MLS"],["eng.2","Championship"]];
const TABS=["eng.1","esp.1","ita.1","ger.1","fra.1","uzb.1","uefa.champions","uefa.europa","tur.1","ned.1","por.1","ksa.1"];
const NAME=Object.fromEntries(LEAGUES);
const WD=["Yak","Dush","Sesh","Chor","Pay","Juma","Shan"],MO=["yan","fev","mar","apr","may","iyn","iyl","avg","sen","okt","noy","dek"];
let M=[],TB={},news=null,day=0,cf="*",lg="eng.1",failed=0;
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const img=u=>u?`<img src="${esc(u)}" alt="" loading="lazy" onerror="this.remove()">`:"";
const tm=u=>new Date(u).toLocaleTimeString("ru",{hour:"2-digit",minute:"2-digit",timeZone:TZ});
const dkey=u=>new Date(u).toLocaleDateString("sv",{timeZone:TZ});
const dshort=u=>{const d=new Date(new Date(u).toLocaleString("en-US",{timeZone:TZ}));return `${WD[d.getDay()]}, ${d.getDate()}-${MO[d.getMonth()]}`};
const isLive=m=>m.st==="IN_PLAY"||m.st==="PAUSED";
const ymd=o=>{const d=new Date(Date.now()+o*864e5);return d.toISOString().slice(0,10).replace(/-/g,"")};
function ago(d){if(!d)return"";const m=Math.max(1,Math.round((Date.now()-new Date(d))/6e4));
  return m<60?`${m} daq oldin`:m<1440?`${Math.round(m/60)} soat oldin`:`${Math.round(m/1440)} kun oldin`;}
async function jget(url,ms=12000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
  try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error(r.status);return await r.json();}finally{clearTimeout(t);}}
const num=v=>{const n=parseInt(v);return isNaN(n)?null:n};

function parseEvents(d,slug){
  const out=[];
  for(const e of d.events||[]){
    try{
      const c=(e.competitions||[{}])[0],cs=c.competitors||[];
      const home=cs.find(x=>x.homeAway==="home"),away=cs.find(x=>x.homeAway==="away");
      if(!home||!away)continue;
      const so=e.status||c.status||{},tp=so.type||{},nm=(tp.name||"").toUpperCase(),state=tp.state;
      let st="TIMED";
      if(nm.includes("POSTPONED"))st="POSTPONED";
      else if(nm.includes("CANCEL")||nm.includes("ABANDON"))st="CANCELLED";
      else if(nm.replace(/_/g,"").includes("HALFTIME"))st="PAUSED";
      else if(state==="in")st="IN_PLAY";
      else if(state==="post")st="FINISHED";
      const ht=home.team||{},at=away.team||{};
      const sc=["IN_PLAY","PAUSED","FINISHED"].includes(st);
      const h=ht.shortDisplayName||ht.displayName||"",a=at.shortDisplayName||at.displayName||"";
      out.push({id:"e"+e.id,slug,comp:NAME[slug]||slug,utc:new Date(e.date).toISOString(),st,h,a,
        hc:ht.logo||"",ac:at.logo||"",hs:sc?num(home.score):null,as:sc?num(away.score):null,
        clk:st==="IN_PLAY"?(so.displayClock||""):"",
        uz:slug==="uzb.1"||/uzbekistan/i.test(h+" "+a)});
    }catch(x){}
  }
  return out;
}
let lastErr="";
const ESPN_B=["https://site.api.espn.com/apis/site/v2/sports/soccer/","https://site.web.api.espn.com/apis/site/v2/sports/soccer/"];
async function loadLeague(slug){
  let evs=null;
  for(const b of ESPN_B){
    try{evs=parseEvents(await jget(`${b}${slug}/scoreboard?dates=${ymd(-1)}-${ymd(2)}`),slug);break;}
    catch(e){lastErr=e.name==="AbortError"?"vaqt tugadi":String(e.message||e);}
  }
  if(evs===null){
    const rs=await Promise.allSettled([-1,0,1,2].map(o=>jget(`${ESPN_B[0]}${slug}/scoreboard?dates=${ymd(o)}`)));
    const ok=rs.filter(r=>r.status==="fulfilled");
    if(ok.length){const seen=new Map();ok.forEach(r=>parseEvents(r.value,slug).forEach(m=>seen.set(m.id,m)));evs=[...seen.values()];}
  }
  if(evs===null)failed++;else M=M.filter(m=>m.slug!==slug).concat(evs);
  renderMatches();
}
async function loadAll(){
  failed=0;
  await Promise.allSettled(LEAGUES.map(([s])=>loadLeague(s)));
  if(failed===LEAGUES.length)$("#out").innerHTML=`<div class="empty">O'yinlar yuklanmadi.<br>Reklama bloklovchini (AdBlock) o'chirib, sahifani yangilang.<div class="err">${esc(lastErr)}</div></div>`;
}

function cards(ms,dt){
  const lc={};ms.forEach(m=>{if(isLive(m))lc[m.comp]=(lc[m.comp]||0)+1});
  let comp=null,h="";
  for(const m of ms){
    const live=isLive(m),done=m.st==="FINISHED",off=m.st==="POSTPONED"||m.st==="CANCELLED";
    if(m.comp!==comp){if(comp!==null)h+="</div>";comp=m.comp;
      h+=`<div class="lg"><div class="lgh"><b>${esc(comp)}</b>${lc[comp]?`<em>${lc[comp]} jonli</em>`:""}</div>`;}
    const mid=live||done
      ?`<div class="c ${live?"live":""}">${m.hs??0} – ${m.as??0}<small>${live?(m.st==="PAUSED"?"Tanaffus":esc(m.clk)||"Jonli"):"Tugadi"}</small></div>`
      :`<div class="c">${off?"–":tm(m.utc)}<small>${off?(m.st==="POSTPONED"?"Kechiktirildi":"Bekor"):dt?dshort(m.utc):""}</small></div>`;
    h+=`<div class="m ${live?"lv":""}"><div class="t r"><b>${esc(m.h)}</b>${img(m.hc)}</div>${mid}<div class="t">${img(m.ac)}<b>${esc(m.a)}</b></div></div>`;
  }
  return h+(comp!==null?"</div>":"");
}
const ord=m=>(m.uz?-1:0)*100+LEAGUES.findIndex(l=>l[0]===m.slug);
function sortMs(ms){return ms.slice().sort((a,b)=>ord(a)-ord(b)||(a.utc<b.utc?-1:1));}
function dayMs(d){const k=new Date(Date.now()+d*864e5).toLocaleDateString("sv",{timeZone:TZ});return M.filter(m=>dkey(m.utc)===k);}

function renderMatches(){
  $("#days").innerHTML=[["-1","Kecha"],["0","Bugun"],["1","Ertaga"]].map(([k,v])=>`<button class="chip ${k==String(day)?"on":""}" data-d="${k}">${v}</button>`).join("");
  const all=sortMs(dayMs(day)),comps=[...new Set(all.map(m=>m.comp))];
  if(cf!=="*"&&!comps.includes(cf))cf="*";
  $("#comps").innerHTML=all.length?`<button class="chip ${cf==="*"?"on":""}" data-c="*">Hammasi<i>${all.length}</i></button>`
    +comps.map(c=>`<button class="chip ${c===cf?"on":""}" data-c="${esc(c)}">${esc(c)}<i>${all.filter(m=>m.comp===c).length}</i></button>`).join(""):"";
  if(!all.length){
    if(!M.length&&failed<LEAGUES.length){$("#out").innerHTML=`<div class="empty">Yuklanmoqda…</div>`;return;}
    const nw=new Date().toISOString(),up=sortMs(M.filter(m=>m.utc>nw&&m.st==="TIMED")).sort((a,b)=>a.utc<b.utc?-1:1).slice(0,10);
    $("#out").innerHTML=`<div class="empty">Bu kunda o'yin yo'q</div>`+(up.length?`<h3 class="sec">Yaqinda</h3>`+cards(up,true):"");
    return;}
  $("#out").innerHTML=cards(cf==="*"?all:all.filter(m=>m.comp===cf),false);
}

async function loadTable(slug){
  const c=TB[slug];if(c&&Date.now()-c.t<6e5)return renderTable();
  $("#tbl").innerHTML=`<div class="empty">Yuklanmoqda…</div>`;
  try{
    const d=await jget(`${ESPN2}${slug}/standings`);
    const en=(((d.children||[])[0]||{}).standings||{}).entries||[];
    const g=(e,n)=>{const s=(e.stats||[]).find(x=>x.name===n);return s?s.value:null;};
    const rows=en.map((e,i)=>({pos:g(e,"rank")??i+1,n:(e.team||{}).shortDisplayName||(e.team||{}).displayName||"",
      c:(((e.team||{}).logos||[])[0]||{}).href||"",p:g(e,"gamesPlayed")??0,gd:g(e,"pointDifferential")??0,pts:g(e,"points")??0}))
      .sort((a,b)=>a.pos-b.pos);
    TB[slug]={t:Date.now(),rows};
  }catch(e){TB[slug]={t:Date.now()-5.5*6e4,rows:[]};}
  renderTable();
}
function renderTable(){
  $("#lgs").innerHTML=TABS.map(k=>`<button class="chip ${k===lg?"on":""}" data-l="${k}">${esc(NAME[k]||k)}</button>`).join("");
  const c=TB[lg];if(!c)return;
  $("#tbl").innerHTML=c.rows.length?`<div class="row h"><span>#</span><span>Jamoa</span><span>O</span><span>+/-</span><span>Ochko</span></div>`
    +c.rows.map(r=>`<div class="row"><span>${esc(r.pos)}</span><div class="n">${img(r.c)}<span>${esc(r.n)}</span></div><span>${esc(r.p)}</span><span>${esc(r.gd)}</span><b>${esc(r.pts)}</b></div>`).join("")
    :`<div class="empty">Bu liga uchun jadval topilmadi</div>`;
}

async function loadNews(){
  const src="https://t.me/s/onsportsuz";
  const px=[u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u),u=>"https://corsproxy.io/?url="+encodeURIComponent(u)];
  for(const p of px){
    try{
      const r=await fetch(p(src));if(!r.ok)continue;
      const doc=new DOMParser().parseFromString(await r.text(),"text/html");
      const items=[...doc.querySelectorAll(".tgme_widget_message")].map(el=>{
        const post=el.getAttribute("data-post");if(!post)return null;
        const tx=el.querySelector(".tgme_widget_message_text");
        const lines=tx?(tx.innerHTML.replace(/<br\s*\/?>/gi,"\n").replace(/<[^>]+>/g,"")).split("\n").map(s=>s.trim()).filter(Boolean):[];
        const ph=el.querySelector(".tgme_widget_message_photo_wrap");
        const mm=ph&&(ph.getAttribute("style")||"").match(/url\('([^']+)'\)/);
        const t=el.querySelector("time");
        const dec=s=>{const x=document.createElement("textarea");x.innerHTML=s;return x.value};
        if(!lines.length&&!mm)return null;
        return {title:dec(lines[0]||"").slice(0,140),img:mm?mm[1]:"",date:t?t.getAttribute("datetime"):"",link:"https://t.me/"+post};
      }).filter(Boolean).reverse().slice(0,9);
      if(items.length){news=items;renderNews();return;}
    }catch(e){}
  }
  if(!news)$("#news").innerHTML=`<a class="tgcta" href="https://t.me/onsportsuz" target="_blank" rel="noopener"><b>Yangiliklar Telegramda</b><span>Hozir bu yerda ko'rsatib bo'lmadi. Kanalni ochish uchun bosing.</span></a>`;
}
function renderNews(){
  const a=news||[];if(!a.length)return;
  let h="",rest=a;
  if(a[0].img){const f=a[0];rest=a.slice(1);
    h+=`<a class="hero" href="${esc(f.link)}" target="_blank" rel="noopener"><img src="${esc(f.img)}" alt=""><div class="ov"><small><b>ONSPORTS.UZ</b> ${ago(f.date)}</small><h2>${esc(f.title)}</h2></div></a>`;}
  $("#news").innerHTML=h+`<div class="card">`+rest.map(x=>`<a class="nr" href="${esc(x.link)}" target="_blank" rel="noopener"><div><small><b>ONSPORTS.UZ</b> ${ago(x.date)}</small><h4>${esc(x.title)}</h4></div>${x.img?`<img class="th" src="${esc(x.img)}" alt="" loading="lazy" onerror="this.remove()">`:""}</a>`).join("")+`</div>`;
}

document.addEventListener("click",e=>{
  const d=e.target.closest("[data-d]"),c=e.target.closest("[data-c]"),l=e.target.closest("[data-l]");
  const tb=e.target.closest("[data-tab]");
  if(tb){e.preventDefault();showTab(tb.dataset.tab);return;}
  if(d){day=+d.dataset.d;cf="*";renderMatches();}
  else if(c){cf=c.dataset.c;renderMatches();}
  else if(l){lg=l.dataset.l;loadTable(lg);}
});
function showTab(t){if(!document.querySelector(".tab#"+t))t="oyinlar";document.querySelectorAll(".tab").forEach(x=>x.hidden=x.id!==t);
  document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("on",x.dataset.tab===t));window.scrollTo(0,0);}
showTab((location.hash||"").slice(1).replace(/^$/,"oyinlar"));
renderMatches();loadAll();loadTable(lg);loadNews();
setInterval(()=>{const hasLive=M.some(isLive);if(hasLive||!window.__t||Date.now()-window.__t>3e5){window.__t=Date.now();loadAll();}},30000);
setInterval(loadNews,6e5);
</script>
</body>
</html>
