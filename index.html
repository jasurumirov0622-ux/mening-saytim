<style>
:root{--bg:#0b1220;--card:#131c30;--line:#22304d;--tx:#eef2fa;--mu:#8a98b5;--ac:#2fd08a;--live:#ff5a5f}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
img{width:22px;height:22px;object-fit:contain;flex:none}
header{position:sticky;top:0;z-index:5;background:rgba(11,18,32,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:1080px;margin:0 auto;padding:0 16px;height:60px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-size:22px;font-weight:800;text-decoration:none}
.logo span{color:var(--ac)}
.bar nav{display:flex;gap:6px;align-items:center}
.bar nav a{padding:7px 14px;border-radius:99px;text-decoration:none;color:var(--mu);font-weight:600;font-size:14px}
.bar nav a:hover{color:var(--tx);background:var(--card)}
.bar nav a.tgb{border:1px solid var(--ac);color:var(--ac)}
.bar nav a.tgb:hover{background:var(--ac);color:#052015}
.pt{margin:18px 16px 4px;font-size:24px}
.pt small{display:block;color:var(--mu);font:600 12px system-ui;letter-spacing:1px;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:8px 16px}
.chip{border:1px solid var(--line);background:none;color:var(--mu);padding:7px 14px;border-radius:99px;white-space:nowrap}
.chip.on{background:var(--ac);border-color:var(--ac);color:#052015;font-weight:700}
.chip i{font-style:normal;opacity:.7;margin-left:4px;font-size:12px}
.lg,.card{background:var(--card);border:1px solid var(--line);border-radius:18px;margin:10px 16px;overflow:hidden}
.card{padding:4px 0}
.lgh{display:flex;align-items:center;gap:10px;padding:12px 14px;font-size:15px;background:linear-gradient(90deg,rgba(47,120,214,.22),transparent 70%)}
.lgh em{font-style:normal;color:var(--live);font-size:13px;font-weight:700}
.m{position:relative;display:grid;grid-template-columns:1fr 72px 1fr;align-items:center;gap:8px;padding:12px;border-top:1px solid var(--line)}
.m.lv::before{content:"";position:absolute;left:0;top:12%;bottom:12%;width:4px;border-radius:0 4px 4px 0;background:var(--live)}
.t{display:flex;align-items:center;gap:8px;min-width:0}
.t.r{justify-content:flex-end;text-align:right}
.t b{font-weight:600;overflow:hidden;text-overflow:ellipsis}
.c{text-align:center;font-size:20px;font-weight:800;line-height:1.15;padding:9px 6px;border-radius:16px;background:#1a2338;border:1px solid var(--line);font-variant-numeric:tabular-nums}
.c small{display:block;margin-top:3px;font-size:12px;font-weight:600;color:var(--mu)}
.c.live{background:#2b1a27;border-color:#3d2234}
.c.live small{color:var(--live)}
.empty{text-align:center;color:var(--mu);padding:40px 16px}
h3.sec{margin:16px 16px 6px;font-size:14px;color:var(--mu);font-weight:600}
.row{display:grid;grid-template-columns:24px 1fr 28px 34px 34px;align-items:center;gap:8px;margin:0 16px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row.h{color:var(--mu);font-size:12px}
.row .n{display:flex;align-items:center;gap:8px;min-width:0}
.row .n span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row>*:nth-child(n+3){text-align:right}
.hero{display:block;position:relative;margin:10px 16px;border-radius:20px;overflow:hidden;height:230px;color:#fff;text-decoration:none;background:#000}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero .ov{position:absolute;inset:0;padding:16px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(transparent 30%,rgba(0,0,0,.88))}
.hero h2{margin:4px 0 0;font-size:20px;line-height:1.25}
.nr{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);text-decoration:none}
.nr:last-child{border:0}
.nr div{flex:1}
.nr h4{margin:4px 0 0;font-size:15px;line-height:1.3}
.nr img.th{width:64px;height:64px;border-radius:10px;object-fit:cover}
.nr small,.hero small{font-size:12px;color:var(--mu)}
.nr small b,.hero small b{color:var(--ac)}
.hero small{color:#ffffffb0}
.tgcta{display:block;margin:10px 16px;padding:18px;border-radius:22px;background:linear-gradient(135deg,#0f5a44,#12233a 75%);border:1px solid var(--line);text-decoration:none}
.tgcta b{display:block;font-size:18px}
.tgcta span{color:#b7c6d6;font-size:14px}
footer{border-top:1px solid var(--line);color:var(--mu);text-align:center;padding:22px 16px;font-size:13px}
.page{max-width:760px;margin:0 auto;padding:8px 0 60px}
.tab[hidden]{display:none}
.bar nav a.on{background:var(--card);color:var(--tx)}
.err{color:var(--mu);font-size:12px;margin-top:8px}
@media(max-width:640px){.bar nav a{padding:7px 10px;font-size:13px}.logo{font-size:19px}.bar{gap:6px}}

/* news portal layout */
header{background:none;backdrop-filter:none;border:0;padding:0}
.bar{width:calc(100% - 32px);max-width:1068px;margin:10px auto;padding:0 12px;height:56px;border:1px solid var(--line);border-radius:18px;background:var(--card)}
.page{max-width:1100px}
.narrow{max-width:760px;margin:0 auto}
.nwrap{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;padding:8px 16px 0}
.nhero{position:relative;display:block;border-radius:20px;overflow:hidden;min-height:380px;background:linear-gradient(135deg,#17335a,#0f1729);color:#fff;text-decoration:none}
.nhero>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.nhero .ov{position:absolute;inset:0;padding:22px;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(transparent 25%,rgba(0,0,0,.88))}
.nhero h2{margin:0 0 8px;font-size:clamp(20px,3vw,30px);line-height:1.2}
.nhero p{margin:0 0 10px;color:#d5dcea;font-size:15px}
.nhero small{color:#ffffffb8;font-size:12px}
.nside{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ncard{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-decoration:none}
.ncard:hover{border-color:var(--ac)}
.nimg{aspect-ratio:16/10;background:linear-gradient(135deg,#17335a,#0f1729);display:grid;place-items:center;color:var(--ac);font-weight:800;font-size:13px;overflow:hidden}
.nimg img{width:100%;height:100%;object-fit:cover}
.nbody{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.nbody h3{margin:0;font-size:15px;line-height:1.3;font-weight:700}
.nbody small{color:var(--mu);font-size:12px}
.more{display:flex;align-items:center;gap:14px;margin:30px 16px 16px;color:var(--mu);font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase}
.more::before,.more::after{content:"";flex:1;height:1px;background:var(--line)}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px;padding:0 16px}
@media(max-width:820px){.nwrap{grid-template-columns:1fr}.nhero{min-height:300px}}
@media(max-width:480px){.nside{grid-template-columns:1fr}}
.crumb{max-width:1068px;margin:0 auto;padding:6px 16px 2px;color:var(--mu);font-size:13px}.crumb b{color:var(--tx);font-size:16px;margin:0 6px}.crumb i{font-style:normal;color:var(--ac)}

:root[data-theme="light"]{--bg:#f3f6fb;--card:#ffffff;--line:#dde4ee;--tx:#101828;--mu:#667085;--ac:#0fa968;--live:#e5383b}
[data-theme="light"] .c{background:#eef2f8}
[data-theme="light"] .c.live{background:#fdecee;border-color:#f5c6cb}
[data-theme="light"] .nimg{background:linear-gradient(135deg,#dbe7f7,#eef2f8)}
[data-theme="light"] .tgcta{background:linear-gradient(135deg,#d9f5e8,#e6edf8)}
[data-theme="light"] .tgcta span{color:#475467}
[data-theme="light"] .nbody small,[data-theme="light"] .nhero small{}
.tools{display:flex;align-items:center;gap:2px;margin-left:8px;padding:3px;border:1px solid var(--line);border-radius:99px}
.ib{width:36px;height:36px;border:0;background:none;border-radius:50%;color:var(--tx);display:grid;place-items:center}
.ib:hover{background:var(--bg)}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#sq{background:none;border:0;color:var(--tx);font:inherit;width:170px;padding:0 8px;outline:none}
#sq[hidden]{display:none}
@media(max-width:640px){.bar nav a.tgb{display:none}#sq{width:110px}.tools{margin-left:4px}}

.lb{width:auto;padding:0 10px;gap:6px;display:flex;align-items:center;border-left:1px solid var(--line);border-radius:0 99px 99px 0;font-weight:700;font-size:13px;margin-left:2px}
.lb svg{width:18px;height:18px}
@media(max-width:640px){.bar{height:auto;flex-wrap:wrap;padding:8px 12px;row-gap:6px}.bar nav{order:3;width:100%;justify-content:space-around}}

/* match details */
.m{grid-template-columns:1fr 84px 1fr}
.m.k{cursor:pointer;transition:background .15s}
.m.k:hover,.m.k:focus-visible{background:rgba(47,208,138,.07)}
.c small.pn{margin-top:1px;color:var(--ac);font-weight:700}
.pw{font-style:normal;flex:none;width:18px;height:18px;border-radius:50%;background:var(--ac);color:#052015;font-size:12px;font-weight:800;display:grid;place-items:center}
.mo{position:fixed;inset:0;z-index:50;background:rgba(3,8,18,.72);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:16px}
.mo[hidden]{display:none}
.mb{position:relative;width:100%;max-width:640px;margin:auto 0;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px 16px 20px}
.mx{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--tx);font-size:20px;line-height:1}
.mcomp{text-align:center;color:var(--mu);font-size:13px;margin:0 36px 12px}
.mh{display:grid;grid-template-columns:1fr 96px 1fr;gap:8px;align-items:center}
.mh .t{flex-direction:column;text-align:center;gap:6px}
.mh .t img{width:44px;height:44px}
.mh .t b{white-space:normal}
.mh .pwr{display:flex;align-items:center;gap:6px}
.sec2{margin:20px 0 8px;font-size:13px;color:var(--mu);font-weight:700;letter-spacing:.5px;text-transform:uppercase;text-align:center}
.ev{display:grid;grid-template-columns:1fr 56px 1fr;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:14px}
.ev .eh{text-align:right}.ev .em{text-align:center;color:var(--mu);font-weight:700;font-variant-numeric:tabular-nums}
.ev small{color:var(--mu)}
.ev.g .em,.ev.pg .em{color:var(--ac)}
.sr{display:grid;grid-template-columns:48px 1fr 48px;gap:8px;align-items:center;padding:7px 0;font-size:14px}
.sr .sv{font-weight:700;font-variant-numeric:tabular-nums}.sr .sv:last-child{text-align:right}
.sr .sl{text-align:center;color:var(--mu);font-size:12px}
.sb{display:flex;gap:3px;height:5px;margin-top:4px}.sb i{display:block;border-radius:3px;background:var(--ac)}.sb i.b{background:#4a7bd8}
.pk{display:flex;gap:10px;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line);font-size:14px}
.pk .ok{color:var(--ac);font-weight:800}.pk .no{color:var(--live);font-weight:800}
.h2{display:grid;grid-template-columns:78px 1fr 62px 1fr;gap:6px;align-items:center;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.h2 small{color:var(--mu)}.h2 .a{text-align:right}.h2 .s{text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.h2s{display:flex;justify-content:space-around;text-align:center;font-size:13px;margin-bottom:6px}.h2s b{display:block;font-size:20px}
.fm{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fm>div{text-align:center}.fm b{display:block;font-size:13px;margin-bottom:6px}
.fc{display:inline-grid;place-items:center;width:24px;height:24px;margin:0 2px;border-radius:6px;font-size:12px;font-weight:800;color:#fff}
.fc.W{background:#1fa971}.fc.D{background:#8a98b5}.fc.L{background:#e5484d}
.fb{margin-top:8px}.fb>b{display:flex;align-items:center;gap:8px;font-size:14px;margin:10px 0 2px}.fb>b img{width:20px;height:20px}
.fl{display:grid;grid-template-columns:74px 1fr 56px 26px;gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.fl small{color:var(--mu)}.fl .s{text-align:center;font-weight:800;font-variant-numeric:tabular-nums}

/* modal tabs & cards */
.mt{display:flex;gap:4px;margin:16px 0 8px;padding:4px;background:var(--bg);border:1px solid var(--line);border-radius:14px}
.mt button{flex:1;border:0;background:none;color:var(--mu);padding:9px 4px;border-radius:10px;font:inherit;font-size:13px;font-weight:700;white-space:nowrap;cursor:pointer}
.mt button.on{background:var(--ac);color:#052015}
.h2s{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0}
.h2s>div{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 6px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.h2s>div b{display:block;font-size:26px;line-height:1.1}
.h2s>div span{font-weight:700}
.h2s>div.dw{color:var(--mu)}
.h2s>div.w:first-child b{color:var(--ac)}.h2s>div.w:last-child b{color:#4a7bd8}
.h2,.fl{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.h2 .s{background:var(--card);border-radius:8px;padding:4px 0}
.fs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.fs button{display:flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:none;color:var(--mu);padding:10px 8px;border-radius:12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer;min-width:0}
.fs button span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fs button.on{background:var(--ac);border-color:var(--ac);color:#052015}
.fs img{width:20px;height:20px;flex:none}
.fp{display:flex;justify-content:center;gap:6px;margin:4px 0 12px}
.fp .fc{width:30px;height:30px;font-size:13px;margin:0}

/* jonli efir */
.mt{overflow-x:auto;scrollbar-width:none}.mt::-webkit-scrollbar{display:none}
.mt button{flex:1 0 auto;padding:9px 12px}
.mt button.ef{color:#ff6b6b}.mt button.ef.on{background:#e5484d;color:#fff}
.chip.lvc{display:inline-flex;align-items:center;gap:6px;border-color:#e5484d;color:#ff6b6b;font-weight:700}
.chip.lvc.on{background:#e5484d;border-color:#e5484d;color:#fff}
.ld{width:8px;height:8px;border-radius:50%;background:currentColor;animation:bl 1.2s infinite}
@keyframes bl{50%{opacity:.25}}
.efs{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.efs button{border:1px solid var(--line);background:none;color:var(--mu);padding:7px 14px;border-radius:99px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.efs button.on{background:var(--ac);border-color:var(--ac);color:#052015}
.efv{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:16/9}
.efv video{width:100%;height:100%;display:block;background:#000}
.efm{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:13px;text-align:center;padding:12px;pointer-events:none}
.efbtn{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:14px;padding:12px;border-radius:12px;background:#e5484d;color:#fff;font-weight:800;text-decoration:none}
.efbtn .ld{background:#fff}
</style>
</head>

      out.push({id:"e"+e.id,slug,comp:LN(slug),utc:new Date(e.date).toISOString(),st,h,a,
        hc:ht.logo||"",ac:at.logo||"",hs:sc?num(home.score):null,as:sc?num(away.score):null,

async function loadLeague(slug){

  const sw=`<div class="fs"><button data-ft="h" class="${mFT!=="a"?"on":""}">${img(m.hc)}<span>${esc(tn(m.h))}</span></button><button data-ft="a" class="${mFT==="a"?"on":""}">${img(m.ac)}<span>${esc(tn(m.a))}</span></button></div>`;
  const pills=L.some(g=>g.r)?`<div class="fp">${[...L].reverse().map(g=>g.r?`<span class="fc ${g.r}">${T("f"+g.r)}</span>`:"").join("")}</div>`:"";
  const rows=L.length?L.map(g=>`<div class="fl"><small>${g.u?fdate(g.u):""}</small><div>${esc(tn(g.on))}</div><div class="s">${esc(g.sc)}</div>${g.r?`<span class="fc ${g.r}">${T("f"+g.r)}</span>`:"<span></span>"}</div>`).join(""):`<div class="empty" style="padding:14px">—</div>`;
  return sw+pills+rows;
}
function paintModal(){
  const m=M.find(x=>x.id===curM);if(!m)return;
  const d=SM[m.id]||null,lv=isLive(m),up=m.st==="TIMED"&&!lv,pw=penWin(m);
  const mid=up?`<div class="c">${tm(m.utc)}<small>${dshort(m.utc)}</small></div>`
    :`<div class="c ${isLive(m)?"live":""}">${m.hs??0} – ${m.as??0}<small>${subOf(m)}</small>${pnOf(m)}</div>`;
  let h=`<div class="mcomp">${esc(m.comp)} · ${dshort(m.utc)}, ${tm(m.utc)}</div>`
   +`<div class="mh"><div class="t">${img(m.hc)}<b>${esc(tn(m.h))}</b></div>${mid}<div class="t">${img(m.ac)}<b>${esc(tn(m.a))}</b></div></div>`;
  if(pw)h+=`<div style="display:flex;justify-content:center;margin-top:10px"><span class="pwr">${bdg()}<b>${esc(tn(pw==="h"?m.h:m.a))}</b> <small style="color:var(--mu)">— ${esc(T("penw"))}</small></span></div>`;
  const sr=up?"":statRows(m,d),hh=lv?"":h2hHtml(m,d),fm=lv?"":formHtml(m,d),sf=SF[m.id];
  const tabs=[];
  if(lv){tabs.push(["st",T("stt")],["ev",T("tabEv")]);}
  else if(!up){tabs.push(["ev",T("tabEv")]);if(sr)tabs.push(["st",T("stt")]);if(hh)tabs.push(["h2h",T("tabH2")]);if(fm)tabs.push(["fm",T("tabFm")]);}
  else tabs.push(["h2h",T("tabH2")],["fm",T("tabFm")]);
  const cur=tabs.some(t=>t[0]===mTab)?mTab:tabs[0][0];
  if(isLive(m))h+=`<a class="efbtn" href="${esc(efUrl(m))}" target="_blank" rel="noopener noreferrer"><span class="ld"></span>${T("efwatch")}</a>`;
  h+=`<div class="mt" role="tablist">${tabs.map(t=>`<button role="tab" data-mt="${t[0]}" class="${t[0]===cur?"on":""}">${esc(t[1])}</button>`).join("")}</div><div class="mp">`;
  if(cur==="ev"){
    const all=evList(m,d),main=all.filter(x=>!x.so),sh=all.filter(x=>x.so&&(x.k==="g"||x.k==="pg"||x.k==="pm"));
    h+=(main.length?main.map(evRow).join(""):`<div class="empty" style="padding:14px">${T("noev")}</div>`);
    if(sh.length)h+=`<div class="sec2">${T("shoot")}</div>`+sh.map(x=>`<div class="pk"><span>${esc(x.p[0]||"")}</span><span>${esc(tn(x.s==="h"?m.h:m.a))}</span><span class="${x.k==="pm"?"no":"ok"}">${x.k==="pm"?"✗":"✓"}</span></div>`).join("");
  }else if(cur==="st"){h+=sr;}
  else if(cur==="h2h"){h+=hh||`<div class="empty" style="padding:18px">${sf&&sf.hd?T("noh2h"):T("loading")}</div>`;}
  else{h+=fm||`<div class="empty" style="padding:18px">${sf?T("noh"):T("loading")}</div>`;}
  h+=`</div>`;
  $("#mc").innerHTML=h;
}
async function getSum(m){
  for(const b of ESPN_B){try{return await jget(`${b}${m.slug}/summary?event=${m.id.slice(1)}`);}catch(e){}}
  return null;
}
const scr=x=>{const v=x&&x.score;return num(v&&typeof v==="object"?(v.displayValue??v.value):v);};
const cid=x=>String(x?((x.team||{}).id??x.id??""):"");
function parseSched(d,tid){
  return ((d&&d.events)||[]).map(e=>{
    try{
      const c=(e.competitions||[{}])[0],cs=c.competitors||[],st=((c.status||e.status||{}).type)||{};
      const me=cs.find(x=>cid(x)===String(tid)),op=cs.find(x=>x!==me);
      if(!me||!op||!(st.completed||st.state==="post"))return null;
      const ms=scr(me),os=scr(op);if(ms==null||os==null)return null;
      return {u:e.date||c.date||"",ms,os,oid:cid(op),home:me.homeAway==="home",on:((op.team||{}).displayName)||""};
    }catch(x){return null;}
  }).filter(Boolean).sort((a,b)=>a.u<b.u?1:-1);
}
const NAT=["fifa.friendly","fifa.world","fifa.worldq.afc","fifa.worldq.uefa","afc.asian","afc.asian.qual","uefa.euro","uefa.euroq","uefa.nations"];
async function loadSched(m){
  const res={h2h:[],form:{},hd:false};
  try{
    const slugs=[m.slug];if(m.slug==="fifa.friendly"||m.slug==="uefa.nations")NAT.forEach(x=>{if(!slugs.includes(x))slugs.push(x);});
    const get=async tid=>{const out=new Map();
      await Promise.all(slugs.map(async sl=>{for(const b of ESPN_B){try{parseSched(await jget(`${b}${sl}/teams/${tid}/schedule`),tid).forEach(g=>out.set(g.u+g.oid,g));break;}catch(e){}}}));
      return [...out.values()].sort((a,b)=>a.u<b.u?1:-1);};
    const [A,B]=await Promise.all([get(m.hid),get(m.aid)]);
    const fm=L=>L.slice(0,5).map(g=>({u:g.u,r:g.ms>g.os?"W":g.ms<g.os?"L":"D",sc:g.ms+" – "+g.os,on:g.on}));
    res.form[m.hid]=fm(A);res.form[m.aid]=fm(B);
    res.h2h=A.filter(g=>g.oid===m.aid).map(g=>({u:g.u,hi:g.home?m.hid:m.aid,ai:g.home?m.aid:m.hid,hs:g.home?g.ms:g.os,as:g.home?g.os:g.ms}));
  }catch(e){}
  SF[m.id]=res;
}
async function loadH2H(m){
  const r=SF[m.id],slugs=[m.slug];if(m.slug==="fifa.friendly"||m.slug==="uefa.nations")NAT.forEach(x=>{if(!slugs.includes(x))slugs.push(x);});
  const y0=new Date().getFullYear(),have=new Set(r.h2h.map(g=>g.u+g.hi));
  for(let y=y0;y>=y0-9&&r.h2h.length<5;y--){
    await Promise.all(slugs.map(async sl=>{
      for(const b of ESPN_B){
        try{
          parseSched(await jget(`${b}${sl}/teams/${m.hid}/schedule?season=${y}`,8000),m.hid).filter(g=>g.oid===m.aid).forEach(g=>{
            const hi=g.home?m.hid:m.aid,k=g.u+hi;if(have.has(k))return;have.add(k);
            r.h2h.push({u:g.u,hi,ai:g.home?m.aid:m.hid,hs:g.home?g.ms:g.os,as:g.home?g.os:g.ms});});
          break;
        }catch(e){}
      }
    }));
    if(curM!==m.id)return;
    paintModal();
  }
  r.hd=true;
}
async function loadSum(){
  const id=curM,m=M.find(x=>x.id===id);if(!m)return;
  const d=await getSum(m);SM[id]=d||SM[id]||false;
  if(curM===id)paintModal();
  if(m.st!=="TIMED"||isLive(m))return;
  const sumH=!!h2hHtml(m,SM[id]);
  if(SF[id]===undefined){
    if(!formHtml(m,SM[id]))await loadSched(m);else SF[id]={h2h:[],form:{},hd:false};
    if(sumH)SF[id].hd=true;
    if(curM===id)paintModal();
  }
  if(!SF[id].hd&&!sumH&&SF[id].h2h.length<5&&!SF[id].busy){SF[id].busy=1;await loadH2H(m);SF[id].busy=0;if(curM===id)paintModal();}
}

async function loadTable(slug){
  const c=TB[slug];if(c&&Date.now()-c.t<6e5)return renderTable();
  $("#tbl").innerHTML=`<div class="empty">${T("loading")}</div>`;
  try{
    const d=await jget(`${ESPN2}${slug}/standings`);
    const en=(((d.children||[])[0]||{}).standings||{}).entries||[];
    const g=(e,n)=>{const s=(e.stats||[]).find(x=>x.name===n);return s?s.value:null;};
    const rows=en.map((e,i)=>({pos:g(e,"rank")??i+1,n:(e.team||{}).shortDisplayName||(e.team||{}).displayName||"",
      c:(((e.team||{}).logos||[])[0]||{}).href||"",p:g(e,"gamesPlayed")??0,gd:g(e,"pointDifferential")??0,pts:g(e,"points")??0}))
      .sort((a,b)=>a.pos-b.pos);
    TB[slug]={t:Date.now(),rows};
  }catch(e){TB[slug]={t:Date.now()-5.5*6e4,rows:[]};}
  renderTable();
}

    :`<div class="empty">${T("notable")}</div>`;
}
